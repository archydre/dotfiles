# #######################################################################################
# CONFIGURAÇÃO DO HYPRLOCK (TELA DE BLOQUEIO ELEGANTE)
# Tema: Catppuccin Mocha
# #######################################################################################

background {
    monitor =
    path = __HOME__/.local/share/backgrounds/2026-08-15-23-15-28-kwami-fattah-al-sissi-fCvhuIf_wBA-unsplash.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Relógio Grande Central
label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 72
    font_family = Adwaita Sans, JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(166, 173, 200)
    font_size = 18
    font_family = Adwaita Sans, JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(203, 166, 247)
    inner_color = rgba(30, 30, 46, 0.85)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    hide_input = false
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>Incorrect password ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}
