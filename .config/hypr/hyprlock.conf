# #######################################################################################
# CONFIGURAÇÃO DO HYPRLOCK (TELA DE BLOQUEIO E SUSPENSÃO ELEGANTE)
# Tema: Catppuccin Mocha
# #######################################################################################

general {
    immediate_render = true
    hide_cursor = false
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor =
    path = screenshot
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.89
    brightness = 0.80
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ---------------------------------------------------------------------------------------
# RELÓGIO PRINCIPAL (TIPOGRAFIA ELEGANTE)
# ---------------------------------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------------------
# DATA POR EXTENSO
# ---------------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B de %Y")"
    color = rgb(180, 190, 254)
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------------------
# CARD CENTRAL GLASSMORPHIC
# ---------------------------------------------------------------------------------------
shape {
    monitor =
    size = 380, 260
    color = rgba(30, 30, 46, 0.70)
    rounding = 24
    border_size = 2
    border_color = rgba(203, 166, 247, 0.45)
    position = 0, -60
    halign = center
    valign = center
}

# Ícone de Status (Lua / Suspensão)
label {
    monitor =
    text = 󰤄
    color = rgb(203, 166, 247)
    font_size = 36
    font_family = JetBrainsMono Nerd Font
    position = 0, 22
    halign = center
    valign = center
}

# Saudação do Usuário
label {
    monitor =
    text = <span font_weight="bold">Olá, $USER</span>
    color = rgb(205, 214, 244)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# Status de Suspensão / Bloqueio
label {
    monitor =
    text = <span font_style="italic" foreground="##a6adc8">Sessão protegida • Sistema em espera</span>
    color = rgb(166, 173, 200)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -48
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------------------
# CAMPO DE SENHA (CATPPUCCIN MOCHA)
# ---------------------------------------------------------------------------------------
input-field {
    monitor =
    size = 290, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(203, 166, 247)
    inner_color = rgba(17, 17, 27, 0.85)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##a6adc8">Digite a senha para acordar...</span>
    hide_input = false
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>Senha incorreta ($ATTEMPTS)</i>
    position = 0, -115
    halign = center
    valign = center
}

# ---------------------------------------------------------------------------------------
# DICA INFERIOR
# ---------------------------------------------------------------------------------------
label {
    monitor =
    text = 󰌌  Pressione qualquer tecla ou digite sua senha para continuar
    color = rgb(147, 153, 178)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
